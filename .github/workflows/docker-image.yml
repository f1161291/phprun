name: build-and-push-image

# 推送 main/master 或打 v* 标签时自动构建镜像并推送到 GitHub Container Registry
# 注意：只有改动影响镜像的文件（Dockerfile / requirements / app / workflow 本身）才触发构建，
# 改 docker-compose.yml、README 等不会触发（避免网页小改动就打断正在进行的构建）
on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "app/**"
      - ".github/workflows/**"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 镜像名必须全小写（github.repository 可能含大写用户名）
      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
        env:
          REPOSITORY: ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # main/master 分支 → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # 分支名（main）与 commit sha 短码
            type=ref,event=branch
            type=sha,format=short
            # v1.2.3 标签 → 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # x86_64 + arm64 双架构（各平台在对应 Dockerfile 的 ENV/ARG 下构建）
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_PLAYWRIGHT=0
            PIP_INDEX_URL=https://pypi.org/simple
            COMPOSER_MIRROR=https://mirrors.aliyun.com/composer/
          # GitHub Actions 层缓存，二次构建更快
          cache-from: type=gha
          cache-to: type=gha,mode=max
