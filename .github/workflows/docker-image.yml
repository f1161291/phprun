name: build-and-push-image

# 推送 main/master 或打 v* 标签时自动构建镜像并推送到 GitHub Container Registry
# 注意：只有改动影响镜像的文件（Dockerfile / requirements / app / workflow 本身）才触发构建，
# 改 docker-compose.yml、README 等不会触发（避免网页小改动就打断正在进行的构建）
on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "app/**"
      - ".github/workflows/**"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 构建成功后创建 vX.Y 版本标签（GITHUB_TOKEN 需要写权限）
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 每次分支推送自动取下一个版本号：扫描已有 vX.Y 标签，minor 递增（v1.0 → v1.1 → v1.2 …）
      # 打 v* 标签的推送不计算（走下面的 semver 标签）；失败/取消的构建不占版本号
      - name: 计算下一个版本号
        id: bump
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          max_major=1; max_minor=-1
          tags="$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v" --paginate --jq -r '.[].ref' 2>/dev/null | sed 's|refs/tags/v||' || true)"
          for t in $tags; do
            t="${t#v}"
            if [[ "$t" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
              if (( major > max_major )) || { (( major == max_major )) && (( minor > max_minor )); }; then
                max_major=$major; max_minor=$minor
              fi
            fi
          done
          echo "version=${max_major}.$(( max_minor + 1 ))" >> "$GITHUB_OUTPUT"
          echo "next version: v${max_major}.$(( max_minor + 1 ))"

      # GHCR 镜像名必须全小写（github.repository 可能含大写用户名）
      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
        env:
          REPOSITORY: ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # main/master 分支 → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # 自动递增版本号 → v1.0 / v1.1 / v1.2 …
            type=raw,value=v${{ steps.bump.outputs.version || '0.0' }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            # 分支名（main）与 commit sha 短码
            type=ref,event=branch
            type=sha,format=short
            # 手动打 v1.2.3 标签 → 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # x86_64 + arm64 双架构（各平台在对应 Dockerfile 的 ENV/ARG 下构建）
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_PLAYWRIGHT=0
            PIP_INDEX_URL=https://pypi.org/simple
            COMPOSER_MIRROR=https://mirrors.aliyun.com/composer/
          # GitHub Actions 层缓存，二次构建更快
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像推送成功后，把版本号写成本次提交的 git tag（下次构建从它之后递增）
      # 只在分支推送时执行；构建失败/被取消则本步不运行 → 该版本号不会被占用
      - name: 打版本标签
        if: ${{ success() && !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.bump.outputs.version }}"
          if gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f "ref=refs/tags/$v" -f "sha=${{ github.sha }}" --jq '.ref' >/dev/null 2>&1; then
            echo "已创建标签 $v"
          else
            echo "标签 $v 已存在或创建失败（跳过，下次构建会自动用下一个版本号）"
          fi
